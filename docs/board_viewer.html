<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gree bridge rev B - interactive board</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2329;--muted:#5d6873;--line:#dfe3e8;--accent:#1f6feb;
--board:#0f5e3a;--fcu:#c8a24a;--bcu:#6d8fc9;--pad:#d9b45c;--padb:#8fb0e6;--hl:#ff3d7f;--sel:#ffd400;--edge:#e9eef2;--silk:#f4f4f0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1216;--panel:#161b21;--ink:#e3e7ec;--muted:#9aa5b1;--line:#2a323b;--accent:#4c9aff}}
:root[data-theme=dark]{--bg:#0f1216;--panel:#161b21;--ink:#e3e7ec;--muted:#9aa5b1;--line:#2a323b;--accent:#4c9aff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:18px 20px 6px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--muted);max-width:900px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:12px 20px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar button,.bar label{font:13px inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer;user-select:none}
.bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar input[type=search]{flex:1;min-width:140px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:13px inherit}
.bar label input{margin:0 5px 0 0;vertical-align:-1px}
#view{position:relative;overflow:hidden;touch-action:none}
svg{display:block;width:100%;height:auto;max-height:78vh;cursor:grab;background:#1b1f24}
.part{fill:transparent;stroke:transparent;stroke-width:.12;cursor:pointer}
.part:hover{fill:rgba(255,255,255,.10);stroke:#fff}
.part.sel{fill:rgba(255,212,0,.16);stroke:var(--sel);stroke-width:.22}
.ring{fill:none;stroke:var(--sel);stroke-width:.25;pointer-events:none}.ring.m{stroke:#4c9aff}
.part.match{fill:rgba(76,154,255,.22);stroke:#4c9aff;stroke-width:.2}
.pad{cursor:pointer}.lbl{font:700 1px sans-serif;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:.25px;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.dim .cu,.dim .padg,.dim .zone{opacity:.25}
.hl{stroke:var(--hl)!important;fill:var(--hl)!important;opacity:1!important}
.side{padding:14px 16px;max-height:calc(100vh - 40px);overflow:auto;position:sticky;top:12px}
.side h2{margin:0 0 2px;font-size:20px}.side .val{color:var(--muted);margin-bottom:8px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px;margin:8px 0}.kv b{color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
tr.net{cursor:pointer}tr.net:hover td{background:rgba(127,127,127,.12)}tr.net.on td{background:rgba(255,61,127,.15)}
.chip{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);font-size:12px;margin:2px 3px 2px 0;cursor:pointer}
.chip:hover{border-color:var(--accent)}.muted{color:var(--muted)}.role{margin:6px 0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:10px 12px}.side{position:static;max-height:430px}header{padding:14px 12px 4px}svg{max-height:62vh}}
</style></head><body>

function svgPt(cx,cy){const r=svg.getBoundingClientRect();return [vb[0]+(cx-r.left)/r.width*vb[2],vb[1]+(cy-r.top)/r.height*vb[3]]}
svg.addEventListener("wheel",e=>{e.preventDefault();const k=Math.exp(e.deltaY*.0015),[px,py]=svgPt(e.clientX,e.clientY);zoom(k,px,py)},{passive:false});
